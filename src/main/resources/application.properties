# ------------------------------------------------------------
# NovaBank Transfer Portal
# ------------------------------------------------------------
spring.application.name=novabank-transfer
server.port=8082

# In-memory H2 database: Spring Boot creates it automatically and loads schema.sql + data.sql

# Ops team asked for "full visibility" during the pilot
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Helpful error pages for the support team
server.error.include-stacktrace=always
server.error.include-message=always

# Payment gateway (used for card top-ups)
payment.gateway.url=https://api.payments.example.com/v1
payment.gateway.api-key=${PAYMENT_GATEWAY_API_KEY:}
